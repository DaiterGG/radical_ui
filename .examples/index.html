<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>LIMBO — a quiet walk</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#000; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  #stage {
    position:relative;
    width:min(100vw, calc(100vh * 16 / 9));
    aspect-ratio:16 / 9;
    background:#000;
  }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #vig {
    position:absolute; inset:0; pointer-events:none; z-index:3;
    background:
      linear-gradient(180deg, rgba(0,0,0,.28), transparent 16%, transparent 82%, rgba(0,0,0,.32)),
      radial-gradient(ellipse 78% 64% at 50% 46%, transparent 55%, rgba(0,0,0,.34) 84%, rgba(0,0,0,.62) 100%);
  }
  .screen { position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #title {
    background:linear-gradient(180deg, rgba(3,4,6,.38), rgba(3,4,6,.66) 58%, rgba(3,4,6,.82));
    transition:opacity 1.1s ease, visibility 1.1s;
  }
  #title.hide { opacity:0; visibility:hidden; }
  h1 {
    font-weight:200; color:#e9edf2;
    font-size:clamp(42px, 10vw, 116px);
    letter-spacing:.62em; text-indent:.62em;
    text-shadow:0 0 34px rgba(215,226,240,.16);
    margin-bottom:4.5vh;
  }
  h1 span { display:inline-block; opacity:0; transform:translateY(16px); animation:rise 1.2s cubic-bezier(.16,.64,.2,1) forwards; }
  @keyframes rise { to { opacity:1; transform:none; } }
  .deaths { color:#99a1ac; font-size:11px; font-weight:300; letter-spacing:.5em; text-indent:.5em; margin-top:10px; }
  .deaths b { color:#cfd5dd; font-weight:400; }
  .press {
    margin-top:7vh; color:#cfd5dd; font-size:12px; font-weight:300;
    letter-spacing:.42em; text-indent:.42em; text-transform:uppercase;
    animation:blink 2.8s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity:.12; } 50% { opacity:.85; } }
  .hint {
    position:absolute; bottom:6%; left:0; right:0; text-align:center;
    color:#575f69; font-size:10px; letter-spacing:.28em; text-transform:uppercase; line-height:2.1;
  }
  .hint em { font-style:normal; color:#8b93a0; }
  #end { background:transparent; pointer-events:none; opacity:0; transition:opacity 1s ease .4s; }
  #end.show { opacity:1; }
  #end .e1 { font-weight:300; color:#171a1f; font-size:clamp(18px,3.4vw,34px); letter-spacing:.5em; text-indent:.5em; }
  #end .deaths { color:#3c424a; margin-top:6vh; }
  #end .deaths b { color:#171a1f; }
  #end .press { color:#2c3138; animation:none; opacity:.75; }
  #hud {
    position:absolute; left:20px; right:20px; bottom:13px; z-index:4;
    display:flex; justify-content:space-between; pointer-events:none;
    color:rgba(206,213,222,.38); font-size:10px; font-weight:300;
    letter-spacing:.34em; text-transform:uppercase;
    transition:opacity .8s;
  }
  #hud.off { opacity:0; }
  #touch { position:absolute; inset:0; z-index:6; display:none; pointer-events:none; }
  @media (pointer:coarse) { #touch { display:block; } }
  .tb {
    position:absolute; bottom:24px; width:62px; height:62px; border-radius:50%;
    border:1px solid rgba(255,255,255,.2); background:rgba(8,10,14,.3);
    color:rgba(255,255,255,.5); font-size:20px;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto; touch-action:none;
  }
  .tb:active { background:rgba(255,255,255,.12); }
  #tL { left:24px; } #tR { left:100px; }
  #tJ { right:24px; width:74px; height:74px; font-size:24px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="vig"></div>

  <div id="hud" class="off">
    <span>deaths <b id="hDeaths">0</b></span>
    <span id="hSnd">m — sound on · r — restart</span>
  </div>

  <div id="title" class="screen">
    <h1><span style="animation-delay:.15s">L</span><span style="animation-delay:.3s">I</span><span style="animation-delay:.45s">M</span><span style="animation-delay:.6s">B</span><span style="animation-delay:.75s">O</span></h1>
    <p class="deaths">deaths — <b id="tDeaths">0</b></p>
    <p class="press">press any key</p>
    <p class="hint"><em>← → / a d</em> move &nbsp;·&nbsp; <em>space</em> jump &nbsp;·&nbsp; <em>m</em> sound &nbsp;·&nbsp; <em>r</em> restart<br>a quiet homage to playdead</p>
  </div>

  <div id="end" class="screen">
    <p class="e1">the dark lets go</p>
    <p class="deaths">deaths — <b id="eDeaths">0</b></p>
    <p class="press">press r to walk again</p>
  </div>

  <div id="touch">
    <div class="tb" id="tL">◀</div>
    <div class="tb" id="tR">▶</div>
    <div class="tb" id="tJ">↑</div>
  </div>
</div>

<script>
(() => {
'use strict';
/* ============ dom ============ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const VW = 960, VH = 540;
const titleEl = document.getElementById('title');
const endEl   = document.getElementById('end');
const hudEl   = document.getElementById('hud');
const hDeaths = document.getElementById('hDeaths');
const tDeaths = document.getElementById('tDeaths');
const eDeaths = document.getElementById('eDeaths');
const hSnd    = document.getElementById('hSnd');

/* ============ utils ============ */
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const rand  = (a,b)=> a + Math.random()*(b-a);
const mix   = (a,b,t)=>[ (a[0]+(b[0]-a[0])*t)|0, (a[1]+(b[1]-a[1])*t)|0, (a[2]+(b[2]-a[2])*t)|0 ];
const rgb   = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const fr    = n => n - Math.floor(n);
const hash  = n => fr(Math.sin(n*127.1)*43758.5453);

/* ============ level ============
   # solid   = one-way plank   ^ spikes   (saws / movers / checkpoints below) */
const TW=210, TH=15, T=32;
const grid  = Array.from({length:TH}, ()=> new Array(TW).fill(' '));
const saws=[], movers=[], cps=[];
const START = { x:4.5*T,  y:12*T };
const EXIT  = { x:203.5*T, y:8*T-14 };

const put    = (x,y,c)=>{ if(x>=0&&x<TW&&y>=0&&y<TH) grid[y][x]=c; };
const ground = (x0,x1,top=12)=>{ for(let x=x0;x<=x1;x++) for(let y=top;y<TH;y++) put(x,y,'#'); };
const plank  = (x0,x1,y)=>{ for(let x=x0;x<=x1;x++) put(x,y,'='); };
const spikeAt= (x,y)=> put(x,y,'^');
const sawAt  = (x,y)=> saws.push({ x:(x+.5)*T, y:(y+.5)*T, r:13, ph:Math.random()*6 });
const cp     = (x,topY)=> cps.push({ x:x*T, y:topY*T, on:false });
const mover  = (x,y,axis,a,b,per)=> movers.push({ x,y,w:96,h:10,axis,a,b,t:Math.random()*per,per,dx:0,dy:0 });

/* forest */
ground(0,29);
ground(34,59);        spikeAt(44,11);
plank(52,54,10);
ground(64,81);
ground(82,99,11);
/* industrial — saw corridor */
ground(104,139);
sawAt(110,11); sawAt(117,11); sawAt(124,11);
sawAt(114,9);  sawAt(121,9);
/* the long drop — riding slabs */
mover(4544,384,'y',288,384,4.4);
mover(4720,320,'x',4720,5080,6.5);
mover(5224,352,'y',256,352,4.0);
/* the climb out */
ground(167,190,10);
ground(191,194,9);     spikeAt(193,8);
ground(195,209,8);
cp(36,12); cp(106,12); cp(168.5,10);

/* ============ player ============ */
const P = { x:0,y:0,w:13,h:27,vx:0,vy:0,face:1,grounded:false,ref:null,coyote:0,jbuf:0,ph:0,stepT:0 };
const spawn = (x,y)=>{ P.x=x; P.y=y; P.vx=0; P.vy=0; P.face=1; P.grounded=false; P.ref=null; };

/* ============ state ============ */
let state='title', stateT=0, time=0, frame=0;
let fade=1, fadeTo=0, fadeCol=[3,4,6];
let shake=0, camX=0, endShown=false, respawned=false, muted=false;
let deathCount=0;
try { deathCount = parseInt(localStorage.getItem('limbo_homage')||'0',10)||0; } catch(e){}
const saveD = ()=>{ try{ localStorage.setItem('limbo_homage', deathCount); }catch(e){} };
const setHud = ()=>{ hDeaths.textContent=deathCount; tDeaths.textContent=deathCount; };
setHud();

/* ============ input ============ */
const keys={};
const JL=['Space','KeyW','ArrowUp'];
addEventListener('keydown', e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  if(state==='title'){ start(); return; }
  if(state==='end'){ if(e.code==='KeyR') restart(); return; }
  if(e.code==='KeyM'){ mute(); return; }
  if(e.code==='KeyR'){ soft(); return; }
  keys[e.code]=true;
  if(JL.includes(e.code)) P.jbuf=.12;
});
addEventListener('keyup', e=>{
  keys[e.code]=false;
  if(JL.includes(e.code) && P.vy<0) P.vy=Math.max(P.vy,-250);
});
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });
addEventListener('contextmenu', e=>e.preventDefault());
titleEl.addEventListener('pointerdown', start);
document.getElementById('stage').addEventListener('pointerdown', ()=>{ if(state==='end') restart(); });
const hold=(el,code)=>{
  el.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); keys[code]=true; if(code==='Space') P.jbuf=.12; });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=> el.addEventListener(ev, ()=> keys[code]=false));
};
hold(document.getElementById('tL'),'ArrowLeft');
hold(document.getElementById('tR'),'ArrowRight');
const tJ=document.getElementById('tJ');
tJ.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); keys.Space=true; P.jbuf=.12; if(state==='title') start(); });
['pointerup','pointerleave','pointercancel'].forEach(ev=> tJ.addEventListener(ev, ()=>{ keys.Space=false; if(P.vy<0) P.vy=Math.max(P.vy,-250); }));

/* ============ audio (all synthesized) ============ */
let AC=null, master=null, noiseBuf=null, sawHum=null, sawHumF=null, sawHumG=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  AC=new C();
  master=AC.createGain(); master.gain.value=muted?0:.85; master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
  { const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  /* low drone */
  const dg=AC.createGain(); dg.gain.value=.05;
  const df=AC.createBiquadFilter(); df.type='lowpass'; df.frequency.value=170;
  df.connect(dg); dg.connect(master);
  [[54,'sine',1],[54.6,'sine',1],[108,'triangle',.35]].forEach(([f,w,g])=>{
    const o=AC.createOscillator(); o.type=w; o.frequency.value=f;
    const gg=AC.createGain(); gg.gain.value=g; o.connect(gg); gg.connect(df); o.start();
  });
  const dl=AC.createOscillator(); dl.frequency.value=.05; const dgl=AC.createGain(); dgl.gain.value=.022;
  dl.connect(dgl); dgl.connect(dg.gain); dl.start();
  /* wind */
  const ns=AC.createBufferSource(); ns.buffer=noiseBuf; ns.loop=true;
  const nf=AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=470; nf.Q.value=.55;
  const ng=AC.createGain(); ng.gain.value=.028;
  ns.connect(nf); nf.connect(ng); ng.connect(master); ns.start();
  const w1=AC.createOscillator(); w1.frequency.value=.08; const w1g=AC.createGain(); w1g.gain.value=.02;
  w1.connect(w1g); w1g.connect(ng.gain); w1.start();
  const w2=AC.createOscillator(); w2.frequency.value=.21; const w2g=AC.createGain(); w2g.gain.value=240;
  w2.connect(w2g); w2g.connect(nf.frequency); w2.start();
  /* proximity saw hum */
  sawHum=AC.createOscillator(); sawHum.type='sawtooth'; sawHum.frequency.value=66;
  sawHumF=AC.createBiquadFilter(); sawHumF.type='lowpass'; sawHumF.frequency.value=280;
  sawHumG=AC.createGain(); sawHumG.gain.value=0;
  sawHum.connect(sawHumF); sawHumF.connect(sawHumG); sawHumG.connect(master); sawHum.start();
}
function tone(o){ if(!AC) return; const t=AC.currentTime;
  const os=AC.createOscillator(); os.type=o.w||'sine';
  os.frequency.setValueAtTime(o.f0,t);
  if(o.f1) os.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1), t+o.d);
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(o.v, t+.015);
  g.gain.exponentialRampToValueAtTime(.0001, t+o.d);
  os.connect(g); g.connect(master); os.start(t); os.stop(t+o.d+.06);
}
function noiz(o){ if(!AC) return; const t=AC.currentTime;
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.f;
  const g=AC.createGain(); g.gain.setValueAtTime(o.v,t);
  g.gain.exponentialRampToValueAtTime(.0001, t+o.d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+o.d+.05);
}
const sfx={
  jump : ()=> tone({f0:165,f1:245,d:.09,v:.045,w:'triangle'}),
  land : v  => noiz({f:clamp(280+v*.45,300,900),d:.07,v:clamp(v/7000+.03,.03,.11)}),
  step : ()=> noiz({f:400+Math.random()*180,d:.045,v:.016}),
  death: ()=>{ tone({f0:130,f1:40,d:.42,v:.16}); noiz({f:170,d:.35,v:.09}); },
  cp   : ()=> tone({f0:500,f1:640,d:.35,v:.02}),
  end  : ()=>{ tone({f0:220,d:2.6,v:.05}); tone({f0:330,d:2.8,v:.04}); tone({f0:440,d:2.2,v:.018}); }
};
function mute(){
  muted=!muted; if(master) master.gain.value=muted?0:.85;
  hSnd.textContent = `m — sound ${muted?'off':'on'} · r — restart`;
}
function hum(){
  if(!AC||!sawHumG) return;
  const px=P.x+P.w/2, py=P.y+P.h/2; let d=1e9;
  for(const s of saws){ const dd=(s.x-px)*(s.x-px)+(s.y-py)*(s.y-py); if(dd<d) d=dd; }
  d=Math.sqrt(d);
  const g = d<250 ? (1-d/250)*.05 : 0;
  sawHumG.gain.setTargetAtTime(g, AC.currentTime, .09);
  sawHum.frequency.setTargetAtTime(58+(1-clamp(d/250,0,1))*26, AC.currentTime, .12);
}

/* ============ pre-rendered sprites ============ */
const glowC=(()=>{ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.3,'rgba(255,255,255,.32)'); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,64,64); return c; })();

const fogC=(()=>{ const c=document.createElement('canvas'); c.width=512; c.height=256; const g=c.getContext('2d');
  for(let i=0;i<26;i++){
    const x=Math.random()*512, y=Math.random()*256, r=34+Math.random()*80, a=.05+Math.random()*.07;
    for(const ox of [x-512,x,x+512]){
      const gr=g.createRadialGradient(ox,y,0,ox,y,r);
      gr.addColorStop(0,`rgba(210,218,228,${a})`); gr.addColorStop(1,'rgba(210,218,228,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(ox,y,r,0,7); g.fill();
    }
  }
  return c; })();

const grainC=document.createElement('canvas'); grainC.width=256; grainC.height=144;
const gtx=grainC.getContext('2d');
const gdata=gtx.createImageData(256,144);
function grainStep(){
  const d=gdata.data;
  for(let i=0;i<d.length;i+=4){ const v=(Math.random()*255)|0; d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=20; }
  gtx.putImageData(gdata,0,0);
}

/* ============ silhouette ridges ============ */
function makeRidge(period, minH, maxH, minW, maxW, kinds){
  const items=[]; let x=0;
  while(x<period){
    const w=rand(minW,maxW);
    items.push({ x, w, h:rand(minH,maxH), k:kinds[(Math.random()*kinds.length)|0] });
    x += w*rand(.55,.85);
  }
  return { period, items };
}
const R={
  fForest1:makeRidge(900, 50,150, 30,70, ['tree']),
  fForest2:makeRidge(760, 90,210, 34,80, ['tree']),
  fForest3:makeRidge(640, 36,105, 26,66, ['tree','bush']),
  fInd1 :makeRidge(860, 60,170, 46,120, ['box','tank']),
  fInd2 :makeRidge(780, 100,230,40,110, ['box','tank']),
  fInd3 :makeRidge(700, 120,240,18,40,  ['pipe'])
};
function spire(x,by,h,w){
  ctx.beginPath();
  ctx.moveTo(x-w/2,by);
  ctx.lineTo(x-w*.16,by-h*.5);   ctx.lineTo(x-w*.3,by-h*.45);
  ctx.lineTo(x-w*.06,by-h*.76);  ctx.lineTo(x-w*.2,by-h*.72);
  ctx.lineTo(x,by-h);
  ctx.lineTo(x+w*.2,by-h*.72);   ctx.lineTo(x+w*.06,by-h*.76);
  ctx.lineTo(x+w*.3,by-h*.45);   ctx.lineTo(x+w*.16,by-h*.5);
  ctx.lineTo(x+w/2,by);
  ctx.closePath(); ctx.fill();
}
function ridge(L,p,by,color,ga,ind){
  if(ga<.02) return;
  ctx.save(); ctx.globalAlpha=ga; ctx.fillStyle=color;
  const per=L.period, off=((camX*p)%per+per)%per;
  for(const it of L.items) for(let k=-1;k<3;k++){
    const x=-off+it.x+k*per;
    if(x>VW+90||x<-160) continue;
    const kk=it.k;
    if(kk==='tree') spire(x+it.w/2,by,it.h,it.w);
    else if(kk==='bush'){ ctx.beginPath(); ctx.ellipse(x+it.w/2,by,it.w/2,Math.max(6,it.h*.45),0,Math.PI,0); ctx.fill(); }
    else if(kk==='box'){
      ctx.fillRect(x,by-it.h,it.w,it.h);
      if(hash(x+.7)>.62) ctx.fillRect(x+it.w*.5-1,by-it.h-14,2,14);
      if(ind&&hash(x*1.3)>.8){ ctx.save(); ctx.globalAlpha=ga*.5; ctx.fillStyle='rgba(214,224,236,.16)'; ctx.fillRect(x+it.w*.22,by-it.h*.62,3,4); ctx.restore(); }
    }
    else if(kk==='tank'){
      const r=it.w*.4, cyy=by-it.h*.75;
      ctx.fillRect(x+it.w*.22,cyy,5,by-cyy); ctx.fillRect(x+it.w*.72,cyy,5,by-cyy);
      ctx.beginPath(); ctx.arc(x+it.w/2,cyy,r,0,7); ctx.fill();
    }
    else if(kk==='pipe'){
      ctx.fillRect(x,by-it.h,14,it.h);
      for(let fy=by-it.h+16; fy<by-4; fy+=44) ctx.fillRect(x-3,fy,20,5);
    }
  }
  ctx.restore();
}

/* ============ particles / ambience ============ */
const parts=[], motes=[], flies=[];
for(let i=0;i<34;i++) motes.push({x:Math.random()*VW, y:Math.random()*VH, vx:rand(-12,-4), vy:rand(2,7), a:rand(.03,.1), s:Math.random()<.85?1:2});
for(let i=0;i<13;i++) flies.push({ x0:rand(3*T,100*T), y0:rand(80,360), p1:rand(0,7), p2:rand(0,7), s1:rand(.15,.4), s2:rand(.2,.5), r:rand(10,26) });
function puff(x,y,n,a){ for(let i=0;i<n;i++) parts.push({x,y, vx:rand(-50,50), vy:rand(-60,-8), g:150, life:0, max:rand(.4,.8), r:rand(1,2.4), a, c:'204,210,220'}); }
function sparks(x,y){ for(let i=0;i<12;i++) parts.push({x,y, vx:rand(-170,170), vy:rand(-240,30), g:520, life:0, max:rand(.35,.7), r:rand(1,2), a:.9, c:'238,242,248'}); }
function ring(x,y){ parts.push({ring:1,x,y,life:0,max:.9,a:.5,c:'220,228,238'}); }
function upParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life+=dt;
    if(p.life>=p.max){ parts.splice(i,1); continue; }
    if(!p.ring){ p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=(1-Math.min(1,2.5*dt)); }
  }
  for(const m of motes){
    m.x+=m.vx*dt; m.y+=m.vy*dt;
    if(m.x<-4){ m.x=VW+4; m.y=Math.random()*VH; }
    if(m.y>VH+4){ m.y=-4; m.x=Math.random()*VW; }
  }
}

/* ============ flow ============ */
function start(){
  if(state!=='title') return;
  initAudio();
  titleEl.classList.add('hide');
  hudEl.classList.remove('off');
  state='play';
}
function die(sx,sy){
  if(state!=='play') return;
  deathCount++; saveD(); setHud();
  state='dying'; stateT=0; respawned=false;
  fadeTo=1; fadeCol=[2,3,4]; shake=10; sfx.death();
  if(sx!=null) sparks(sx,sy);
}
function soft(){
  if(state!=='play') return;
  state='dying'; stateT=.55; respawned=false;
  fadeTo=1; fadeCol=[2,3,4];
}
function respawn(){
  let c=null; for(const k of cps) if(k.on) c=k;
  spawn(c? c.x+4 : START.x, (c? c.y : START.y) - P.h - 2);
  fadeTo=0;
}
function toEnd(){
  if(state!=='play') return;
  state='end'; stateT=0; fadeTo=1; fadeCol=[236,239,243]; sfx.end();
}
function restart(){
  endEl.classList.remove('show'); endShown=false;
  for(const k of cps) k.on=false;
  spawn(START.x, START.y-P.h-2);
  state='play'; fadeTo=0;
}

/* ============ physics ============ */
function solid(tx,ty){ if(tx<0||tx>=TW) return true; if(ty<0||ty>=TH) return false; return grid[ty][tx]==='#'; }
function moveX(dt){
  P.x+=P.vx*dt;
  const y0=Math.floor((P.y+2)/T), y1=Math.floor((P.y+P.h-2)/T);
  if(P.vx>0){ const tx=Math.floor((P.x+P.w)/T);
    for(let ty=y0;ty<=y1;ty++) if(solid(tx,ty)){ P.x=tx*T-P.w-.01; P.vx=0; break; } }
  else if(P.vx<0){ const tx=Math.floor(P.x/T);
    for(let ty=y0;ty<=y1;ty++) if(solid(tx,ty)){ P.x=(tx+1)*T+.01; P.vx=0; break; } }
  for(const m of movers){
    if(P.x+P.w>m.x && P.x<m.x+m.w && P.y+P.h>m.y+4 && P.y<m.y+m.h-2){
      P.x = P.vx>=0 ? m.x-P.w-.01 : m.x+m.w+.01; P.vx=0;
    }
  }
  P.x=clamp(P.x, 2, TW*T-P.w-2);
}
function moveY(dt, prevBot){
  const wasG=P.grounded, impact=P.vy;
  P.grounded=false; P.ref=null;
  P.y+=P.vy*dt;
  const x0=Math.floor((P.x+2)/T), x1=Math.floor((P.x+P.w-2)/T);
  const land=(top,ref)=>{
    P.y=top-P.h; P.vy=0; P.grounded=true; P.ref=ref||null;
    if(!wasG && impact>140){
      puff(P.x+P.w/2, top, impact>420?6:3, impact>420?.5:.3);
      sfx.land(impact);
    }
  };
  if(P.vy>=0){
    const ty=Math.floor((P.y+P.h)/T);
    if(ty<TH){
      for(let tx=x0;tx<=x1;tx++){
        if(solid(tx,ty)){ land(ty*T); break; }
        if(grid[ty][tx]==='=' && prevBot<=ty*T+1){ land(ty*T); break; }
      }
    }
    if(!P.grounded) for(const m of movers){
      if(P.x+P.w>m.x+2 && P.x<m.x+m.w-2 && P.y+P.h>=m.y && prevBot<=m.y+1){ land(m.y, m); break; }
    }
  } else {
    const ty=Math.floor(P.y/T);
    for(let tx=x0;tx<=x1;tx++) if(solid(tx,ty)){ P.y=(ty+1)*T+.01; P.vy=0; break; }
  }
}
function upMovers(dt){
  for(const m of movers){
    m.t+=dt;
    const k=(Math.sin(m.t*2*Math.PI/m.per - Math.PI/2)+1)/2;
    const ox=m.x, oy=m.y;
    const nx = m.axis==='x' ? m.a+(m.b-m.a)*k : ox;
    const ny = m.axis==='y' ? m.a+(m.b-m.a)*k : oy;
    m.dx=nx-ox; m.dy=ny-oy; m.x=nx; m.y=ny;
  }
}

/* ============ update ============ */
function update(dt){
  time+=dt;
  upMovers(dt);
  upParts(dt);

  if(state==='play'){
    const L=keys.ArrowLeft||keys.KeyA, Rk=keys.ArrowRight||keys.KeyD;
    const ACC=P.grounded?2600:1800, MAX=252;
    if(L&&!Rk){ P.vx-=ACC*dt; P.face=-1; }
    else if(Rk&&!L){ P.vx+=ACC*dt; P.face=1; }
    else { const f=(P.grounded?2300:300)*dt; P.vx = P.vx>0? Math.max(0,P.vx-f) : Math.min(0,P.vx+f); }
    P.vx=clamp(P.vx,-MAX,MAX);

    P.coyote = P.grounded? .09 : Math.max(0,P.coyote-dt);
    P.jbuf   = Math.max(0,P.jbuf-dt);
    if(P.jbuf>0 && P.coyote>0){
      P.vy=-680; P.jbuf=0; P.coyote=0; P.grounded=false; P.ref=null;
      sfx.jump(); puff(P.x+P.w/2, P.y+P.h, 3, .3);
    }
    P.vy=Math.min(P.vy+2300*dt, 940);

    if(P.ref){ P.x+=P.ref.dx; P.y+=P.ref.dy; }
    const prevBot=P.y+P.h;
    moveX(dt); moveY(dt, prevBot);

    const cx=P.x+P.w/2, cyP=P.y+P.h/2;
    outer:
    for(const s of saws){
      if(Math.abs(s.x-cx)>48) continue;
      const qx=clamp(s.x,P.x,P.x+P.w), qy=clamp(s.y,P.y,P.y+P.h);
      const dx=s.x-qx, dy=s.y-qy;
      if(dx*dx+dy*dy < (s.r-2)*(s.r-2)){ die(s.x,s.y); break outer; }
    }
    if(state==='play'){
      const tx0=Math.floor(P.x/T), tx1=Math.floor((P.x+P.w)/T);
      const ty0=Math.floor(P.y/T), ty1=Math.floor((P.y+P.h)/T);
      for(let ty=ty0; ty<=ty1 && state==='play'; ty++) for(let tx=tx0; tx<=tx1; tx++){
        if(grid[ty] && grid[ty][tx]==='^'){
          const rx=tx*T+5, ry=ty*T+10, rw=T-10, rh=T-10;
          if(P.x+3<rx+rw && P.x+P.w-3>rx && P.y+3<ry+rh && P.y+P.h-1>ry){ die(tx*T+T/2, ry); break; }
        }
      }
    }
    if(state==='play' && P.y> TH*T+26) die(null,null);

    if(state==='play'){
      for(const c of cps) if(!c.on && cx>c.x){ c.on=true; sfx.cp(); ring(c.x+8, c.y-8); }
      if(Math.abs(cx-EXIT.x)<18 && Math.abs((P.y+P.h)-EXIT.y)<44) toEnd();
      if(P.grounded){
        P.ph += Math.abs(P.vx)*dt*.05;
        if(Math.abs(P.vx)>50){
          P.stepT-=dt;
          if(P.stepT<=0){ P.stepT=.27-(Math.abs(P.vx)/MAX)*.09; sfx.step(); puff(P.x+P.w/2, P.y+P.h, 1, .22); }
        }
      }
    }
  }
  else if(state==='dying'){
    stateT+=dt;
    if(stateT>.85 && !respawned){ respawned=true; respawn(); state='play'; }
  }
  else if(state==='end'){
    stateT+=dt;
    if(stateT>1.15 && !endShown){ endShown=true; eDeaths.textContent=deathCount; endEl.classList.add('show'); }
  }

  if(state!=='title'){
    const tx = P.x+P.w/2 + P.face*55 - VW/2;
    camX += (tx-camX)*Math.min(1, dt*4.2);
  }
  if(state==='title') camX = 40+Math.sin(time*.07)*26;
  camX=clamp(camX, 0, TW*T-VW);

  fade += (fadeTo-fade)*Math.min(1, dt*6);
  if(Math.abs(fade-fadeTo)<.004) fade=fadeTo;
  shake=Math.max(0, shake-34*dt);
  hum();
}

/* ============ render ============ */
function drawBoy(){
  const cx=P.x+P.w/2, by=P.y+P.h;
  const mv=Math.abs(P.vx), run=P.grounded&&mv>24;
  const bob=P.grounded? Math.sin(time*2.2)*.6 : 0;
  const lean=(P.grounded? mv/252*.13 : .09)*P.face;
  const ph=P.ph;
  let f1,f2;
  if(!P.grounded){ f1=[5.5,-4]; f2=[-4.5,-1]; }
  else if(run){ const s=Math.sin(ph);
    f1=[s*5, -Math.max(0,Math.cos(ph))*2.2];
    f2=[-s*5, -Math.max(0,-Math.cos(ph))*2.2];
  } else { f1=[2.6,0]; f2=[-2.6,0]; }
  ctx.save();
  ctx.translate(cx,by+bob); ctx.rotate(lean);
  ctx.strokeStyle='#0b0c0e'; ctx.lineCap='round';
  ctx.lineWidth=3.2;
  ctx.beginPath(); ctx.moveTo(0,-12); ctx.quadraticCurveTo(f1[0]/2+1.2,-6,f1[0],f1[1]); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-12); ctx.quadraticCurveTo(f2[0]/2+1.2,-6,f2[0],f2[1]); ctx.stroke();
  ctx.lineWidth=5.2; ctx.beginPath(); ctx.moveTo(0,-11.5); ctx.lineTo(1.2,-19); ctx.stroke();
  ctx.lineWidth=2.8;
  let ax,ay;
  if(!P.grounded){ ax=4; ay=-13.5; }
  else if(run){ ax=Math.sin(ph+Math.PI)*4.4; ay=-11.5; }
  else { ax=1.4; ay=-12; }
  ctx.beginPath(); ctx.moveTo(.8,-18.4); ctx.lineTo(ax,ay); ctx.stroke();
  ctx.fillStyle='#060708'; ctx.beginPath(); ctx.arc(1,-24.4,5,0,7); ctx.fill();
  ctx.fillStyle='#1a1d21'; ctx.beginPath(); ctx.arc(3.1,-22.9,2.9,0,7); ctx.fill();
  ctx.strokeStyle='rgba(202,212,226,.15)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(1.2,-24,4.8,-.85,.85); ctx.stroke();
  ctx.restore();
}
function drawWorld(t){
  const x0=Math.max(0,Math.floor(camX/T)-1), x1=Math.min(TW-1, Math.floor((camX+VW)/T)+1);
  for(let tx=x0; tx<=x1; tx++){
    for(let ty=0; ty<TH; ty++){
      const c=grid[ty][tx]; if(c===' ') continue;
      const x=tx*T, y=ty*T;
      if(c==='#'){
        ctx.fillStyle='#0a0b0c'; ctx.fillRect(x,y,T,T);
        if(ty>0 && grid[ty-1][tx]!=='#'){
          ctx.fillStyle='rgba(190,200,214,.08)'; ctx.fillRect(x,y,T,2);
          const h=hash(tx);
          if(h>.4){
            ctx.strokeStyle='#0a0b0c'; ctx.lineWidth=1.5;
            ctx.beginPath();
            for(let b=0;b<2;b++){
              const bx=x+6+hash(tx*3+b)*20;
              ctx.moveTo(bx,y);
              ctx.lineTo(bx+(hash(tx*7+b)-.5)*5, y-3-h*6);
            }
            ctx.stroke();
          }
        }
      }
      else if(c==='='){
        ctx.fillStyle='#0d0e10'; ctx.fillRect(x,y,T,7);
        ctx.fillStyle='rgba(190,200,214,.1)'; ctx.fillRect(x,y,T,1.5);
      }
      else if(c==='^'){
        ctx.fillStyle='#0b0c0d';
        for(let i=0;i<4;i++){
          ctx.beginPath();
          ctx.moveTo(x+i*8, y+T);
          ctx.lineTo(x+i*8+4, y+9);
          ctx.lineTo(x+i*8+8, y+T);
          ctx.closePath(); ctx.fill();
        }
      }
    }
  }
  for(const m of movers){
    if(m.x>camX+VW+40||m.x+m.w<camX-40) continue;
    ctx.fillStyle='#0d0e10'; ctx.fillRect(m.x,m.y,m.w,m.h);
    ctx.fillStyle='rgba(190,200,214,.12)'; ctx.fillRect(m.x,m.y,m.w,2);
    ctx.fillStyle='#0a0b0c'; ctx.fillRect(m.x+6,m.y+m.h,4,5); ctx.fillRect(m.x+m.w-10,m.y+m.h,4,5);
  }
  for(const s of saws){
    if(s.x>camX+VW+40||s.x<camX-40) continue;
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.ph+time*5);
    ctx.beginPath();
    const N=9;
    for(let i=0;i<N*2;i++){
      const r=(i%2? s.r*.76 : s.r+3), a=i/(N*2)*Math.PI*2;
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath();
    ctx.fillStyle='#2c2f34'; ctx.fill();
    ctx.strokeStyle='#3f434a'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,s.r*.45,0,7); ctx.fillStyle='#191b1e'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,s.r*.18,0,7); ctx.fillStyle='#4c5158'; ctx.fill();
    ctx.restore();
  }
  const pu=.5+.5*Math.sin(time*2.1);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=.35+.2*pu; ctx.drawImage(glowC, EXIT.x-90, EXIT.y-90, 180, 180);
  ctx.globalAlpha=.9; ctx.fillStyle='#eef1f5'; ctx.fillRect(EXIT.x-1.5, EXIT.y-1.5, 3, 3);
  ctx.restore();
  const pcx=P.x+P.w/2, pcy=P.y+P.h/2;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=.14; ctx.drawImage(glowC, pcx-160, pcy-160, 320, 320);
  ctx.restore();
  if(t<.97){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(const f of flies){
      const fx=f.x0+Math.sin(time*f.s1+f.p1)*f.r;
      if(fx<camX-40||fx>camX+VW+40) continue;
      const fy=f.y0+Math.sin(time*f.s2+f.p2)*f.r*.55;
      const a=clamp(.28+.4*Math.sin(time*1.5+f.p1*3),0,.6)*(1-t);
      if(a<=.01) continue;
      ctx.globalAlpha=a; ctx.drawImage(glowC, fx-6, fy-6, 12, 12);
    }
    ctx.restore();
  }
  drawBoy();
  for(const p of parts){
    const k=1-p.life/p.max;
    if(p.ring){
      ctx.strokeStyle=`rgba(${p.c},${(p.a*k).toFixed(3)})`;
      ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(p.x,p.y, 5+(p.life/p.max)*30, 0, 7); ctx.stroke();
    } else {
      ctx.fillStyle=`rgba(${p.c},${(p.a*k).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    }
  }
}
function render(){
  const px=P.x+P.w/2;
  const t=clamp((px-100*T)/(14*T),0,1);

  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0, rgb(mix([21,23,28],[15,17,21],t)));
  g.addColorStop(1, rgb(mix([52,58,66],[40,44,50],t)));
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);

  if(t<.98){
    const mx=700-camX*.05, my=102, a=1-t;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=.22*a; ctx.drawImage(glowC, mx-95, my-95, 190, 190);
    ctx.globalAlpha=.5*a; ctx.fillStyle='#c8cdd4'; ctx.beginPath(); ctx.arc(mx,my,21,0,7); ctx.fill();
    ctx.restore();
  }
  if(t>.02){ ctx.fillStyle=`rgba(184,198,216,${(.05*t).toFixed(3)})`; ctx.fillRect(0,316,VW,2); }

  ridge(R.fForest1,.2,352,'#1b1e23', 1-t, false);
  ridge(R.fInd1   ,.2,352,'#181b20', t,     true);
  ridge(R.fForest2,.48,394,'#111419', 1-t, false);
  ridge(R.fInd2   ,.48,398,'#0f1115', t,     true);
  ridge(R.fForest3,.76,436,'#07080a', 1-t, false);
  ridge(R.fInd3   ,.76,440,'#060708', t,     true);

  ctx.save();
  const shx=(Math.random()-.5)*shake, shy=(Math.random()-.5)*shake;
  ctx.translate(Math.round(-camX)+shx, 60+shy);
  drawWorld(t);
  ctx.restore();

  ctx.fillStyle='#c8d0dc';
  for(const m of motes){ ctx.globalAlpha=m.a; ctx.fillRect(m.x,m.y,m.s,m.s); }
  ctx.globalAlpha=1;

  const rows=[[96,2.1,.045,.3,4],[268,1.25,.075,.6,8],[VH-150,.95,.1,.93,13]];
  for(const [y,s,al,p,sp] of rows){
    const w=512*s, h=256*s, off=(time*sp+camX*p)%w;
    ctx.globalAlpha=al;
    for(let x=-off;x<VW;x+=w) ctx.drawImage(fogC,x,y,w,h);
  }
  ctx.globalAlpha=1;
  { const hg=ctx.createLinearGradient(0,VH-90,0,VH);
    hg.addColorStop(0,'rgba(196,205,216,0)'); hg.addColorStop(1,'rgba(196,205,216,.05)');
    ctx.fillStyle=hg; ctx.fillRect(0,VH-90,VW,90); }

  if(frame%2===0) grainStep();
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(grainC, (Math.random()*96)|0, (Math.random()*54)|0, 160,90, 0,0,VW,VH);
  ctx.imageSmoothingEnabled=true;

  const fl=Math.max(0, .025+.02*Math.sin(time*6.3)+.014*Math.sin(time*17.7));
  ctx.fillStyle=`rgba(0,0,0,${fl.toFixed(3)})`; ctx.fillRect(0,0,VW,VH);

  if(fade>.003){
    ctx.fillStyle=`rgba(${fadeCol[0]},${fadeCol[1]},${fadeCol[2]},${fade.toFixed(3)})`;
    ctx.fillRect(0,0,VW,VH);
  }
}

/* ============ loop ============ */
spawn(START.x, START.y-P.h-2);
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000; last=now;
  dt=clamp(dt,.001,.033);
  frame++;
  update(dt);
  render();
}
requestAnimationFrame(loop);
})();
</script>
</body>
